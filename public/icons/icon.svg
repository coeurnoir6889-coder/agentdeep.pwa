<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0D36" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond sombre -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="108" fill="none" stroke="#2A2A2A" stroke-width="4" />

  <!-- Cerveau Stylisé Néon agentDeep -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Hémisphère Gauche -->
    <path d="M -16 -120 C -70 -120 -130 -80 -130 -10 C -130 30 -110 60 -80 80 C -80 120 -40 140 -16 140 Z" 
          fill="none" stroke="url(#neonViolet)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -24 -70 C -70 -60 -90 -20 -70 20 C -60 40 -40 50 -24 50" 
          fill="none" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" />
    <path d="M -24 -20 C -45 -10 -45 20 -24 30" 
          fill="none" stroke="#7C4DFF" stroke-width="6" stroke-linecap="round" />

    <!-- Hémisphère Droit -->
    <path d="M 16 -120 C 70 -120 130 -80 130 -10 C 130 30 110 60 80 80 C 80 120 40 140 16 140 Z" 
          fill="none" stroke="url(#neonViolet)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 24 -70 C 70 -60 90 -20 70 20 C 60 40 40 50 24 50" 
          fill="none" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" />
    <path d="M 24 -20 C 45 -10 45 20 24 30" 
          fill="none" stroke="#7C4DFF" stroke-width="6" stroke-linecap="round" />

    <!-- Nœuds Synaptiques & Impulsions -->
    <circle cx="0" cy="-120" r="8" fill="#00E5FF" />
    <circle cx="-130" cy="-10" r="7" fill="#7C4DFF" />
    <circle cx="130" cy="-10" r="7" fill="#7C4DFF" />
    <circle cx="-80" cy="80" r="6" fill="#00E5FF" />
    <circle cx="80" cy="80" r="6" fill="#00E5FF" />
    <circle cx="0" cy="140" r="8" fill="#FF6B35" />

    <!-- Éclair central / Synapse -->
    <path d="M 0 -80 L 10 -20 L -10 20 L 5 80" fill="none" stroke="#FF6B35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
